<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111b2d"><title>Brick City Manager · Anmeldung</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 80% 0,#283955,#0a1020 65%);font:16px system-ui,-apple-system,sans-serif;color:#fff;padding:20px}.card{width:min(100%,430px);background:#182338;border:1px solid #3b4a65;border-radius:22px;padding:28px;box-shadow:0 25px 65px #0006}.brand{font-size:24px;font-weight:900}.brand b{color:#fa6170}h1{font-size:27px;margin:28px 0 8px}p{color:#c4cedc;line-height:1.5;font-size:14px}label{display:block;margin:18px 0 6px;font-size:13px}input{width:100%;padding:14px;background:#0e182b;color:white;border:1px solid #53627c;border-radius:10px;font-size:16px}button{display:block;width:100%;padding:14px;margin-top:14px;border:0;border-radius:10px;background:#e64c5d;color:white;font-size:16px;font-weight:700}button.secondary{background:#34435f}button:disabled{opacity:.6}#status{min-height:20px;color:#ffbec7}#open{display:none}</style></head><body><main class="card"><div class="brand">BRICK <b>CITY</b> MANAGER</div><h1>Willkommen zurück.</h1><p>Bitte anmelden, bevor du deine Sammlung öffnest.</p><form id="form"><label for="email">E-Mail-Adresse</label><input id="email" type="email" autocomplete="email" required><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" minlength="6" required><button id="login">Anmelden</button></form><button id="register" class="secondary" type="button">Neues Konto erstellen</button><button id="open" class="secondary">Meine Sammlung öffnen →</button><p id="status" role="status"></p><p>Deine bestehende Sammlung und ihre Werte bleiben unverändert.</p></main><script src="./vendor/supabase.js?v=50.96"></script><script src="./supabase-config.js?v=50.96"></script><script>(function(){const $=id=>document.getElementById(id),status=$('status');let client;let registering=false;function showSession(session){$('open').style.display=session?'block':'none';if(session)status.textContent='Du bist angemeldet. Öffne deine Sammlung.'}function getClient(){if(client)return client;const c=window.LEGO_SUPABASE;if(!window.supabase||!c)throw Error('Anmeldedienst nicht geladen.');return client=window.supabase.createClient(c.url,c.publishableKey)}async function init(){try{const {data,error}=await getClient().auth.getSession();if(error)throw error;showSession(data.session)}catch(e){status.textContent='Anmeldedienst: '+e.message}}$('form').addEventListener('submit',async e=>{e.preventDefault();if(registering){$('register').click();return}$('login').disabled=true;status.textContent='Anmeldung läuft …';try{const {data,error}=await getClient().auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;showSession(data.session)}catch(err){status.textContent='Anmeldung fehlgeschlagen: '+err.message}finally{$('login').disabled=false}});$('register').addEventListener('click',async()=>{if(!registering){registering=true;document.querySelector('h1').textContent='Neues Konto erstellen';document.querySelector('main p').textContent='E-Mail-Adresse und Passwort eingeben, anschließend auf Konto jetzt erstellen tippen.';$('login').style.display='none';$('register').textContent='Konto jetzt erstellen';status.textContent='Registrierung: Bitte E-Mail und ein Passwort mit mindestens 6 Zeichen eingeben.';$('email').focus();return}const email=$('email').value.trim(),password=$('password').value;if(!email||!$('email').checkValidity()){status.textContent='Bitte eine gültige E-Mail-Adresse eingeben.';$('email').focus();return}if(password.length<6){status.textContent='Das Passwort muss mindestens 6 Zeichen haben.';$('password').focus();return}$('register').disabled=true;$('register').textContent='Konto wird erstellt …';status.textContent='Registrierung wird angefragt …';try{const {data,error}=await getClient().auth.signUp({email,password,options:{emailRedirectTo:new URL('./anmelden.html',location.href).href}});if(error)throw error;status.textContent=data?.session?'Konto erstellt und angemeldet. Du kannst deine Sammlung öffnen.':'Registrierung angefragt. Bitte E-Mail-Postfach prüfen und Bestätigungslink öffnen.';showSession(data?.session||null)}catch(err){status.textContent='Registrierung fehlgeschlagen: '+(err?.message||String(err))}finally{$('register').disabled=false;$('register').textContent='Konto jetzt erstellen'}});$('open').addEventListener('click',()=>{sessionStorage.setItem('brick-login-entry-5096','allow');location.assign('./index.html?v=50.97')});init()})();</script></body></html>
