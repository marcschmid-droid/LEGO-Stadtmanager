name: LEGO Katalog & Marktwerte aktualisieren

on:
  push:
    branches: [main]
    paths:
      - "scripts/enrich_catalog.py"
      - ".github/workflows/enrich-catalog.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: lego-catalog-sync
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests requests-oauthlib
      - name: Bilder, Maße und Marktwerte aktualisieren
        env:
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          BRICKECONOMY_API_KEY: ${{ secrets.BRICKECONOMY_API_KEY }}
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
          BRICKLINK_CONSUMER_KEY: ${{ secrets.BRICKLINK_CONSUMER_KEY }}
          BRICKLINK_CONSUMER_SECRET: ${{ secrets.BRICKLINK_CONSUMER_SECRET }}
          BRICKLINK_TOKEN_VALUE: ${{ secrets.BRICKLINK_TOKEN_VALUE }}
          BRICKLINK_TOKEN_SECRET: ${{ secrets.BRICKLINK_TOKEN_SECRET }}
          BRICKECONOMY_BATCH_SIZE: "80"
        run: python scripts/enrich_catalog.py
      - name: Änderungen speichern
        run: |
          if git diff --quiet -- data/set-enrichment.json; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "LEGO Stadtmanager Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/set-enrichment.json
          git commit -m "Auto: Setbilder, Maße und Marktwerte aktualisieren"
          git push
