name: LEGO Katalog & Marktwerte aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: lego-catalog-sync
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Bilder und Marktwerte aktualisieren
        env:
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          BRICKECONOMY_API_KEY: ${{ secrets.BRICKECONOMY_API_KEY }}
          BRICKECONOMY_BATCH_SIZE: "80"
        run: python scripts/enrich_catalog.py
      - name: Änderungen speichern
        run: |
          if git diff --quiet -- data/set-enrichment.json; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "LEGO Stadtmanager Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/set-enrichment.json
          git commit -m "Auto: Setbilder und Marktwerte aktualisieren"
          git push
