name: Stabilitaetspruefung
on:
  push:
    branches: [main, stabilisierung-2026-10]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript Syntax pruefen
        run: |
          node --check app-v3.js
          node --check collection-metrics-v570.js
          node --check customer-experience-v548.js
          node --check focus-v564.js
          node --check ui-repair-v569.js
          node --check collection-view-v571.js
          node --check catalog-resilience-v579.js
          node --check instant-set-lookup-v582.js
          node --check recognition-feedback-v575.js
          node --check catalog-diagnostics-v576.js
          node --check collection-emergency-v573.js
          node --check collection-integrity-v583.js
      - name: Regressionstests
        run: node --test tests/*.test.cjs
