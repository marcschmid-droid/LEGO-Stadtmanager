name: Alle LEGO Setnummern aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "42 4 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebrickable Gesamtkatalog laden
        run: python scripts/build_all_sets.py
      - name: Änderungen speichern
        run: |
          if git diff --quiet -- data/all-sets.json; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "Brick City Manager Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/all-sets.json
          git commit -m "Auto: Alle LEGO Setnummern aktualisieren"
          git push
