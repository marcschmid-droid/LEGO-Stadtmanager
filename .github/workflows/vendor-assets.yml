name: Vendor browser libraries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".vendor-trigger"
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save @supabase/supabase-js@2 @zxing/library@0.23.0
      - name: Copy browser bundles
        run: |
          mkdir -p vendor
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js vendor/supabase.js
          cp node_modules/@zxing/library/umd/index.min.js vendor/zxing.js
      - name: Commit vendored libraries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/supabase.js vendor/zxing.js
          git diff --cached --quiet || git commit -m "Vendor browser libraries for privacy"
          git push
