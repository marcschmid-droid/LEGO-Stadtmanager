name: Catalog metadata lookup (no paid price calls)
on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
permissions:
  contents: write
concurrency:
  group: lego-catalog-sync
  cancel-in-progress: false
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Resolve requested set numbers
        env:
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}

          REQUESTS_ONLY: "1"
          # No BrickEconomy key here by design: hourly metadata only.\n          # Paid market prices are handled by process-catalog-requests.yml\n          # with quota checks, retries and confirmed catalog persistence.\n          BRICKECONOMY_BATCH_SIZE: "0"
        run: python scripts/enrich_catalog.py
      - name: Commit catalog updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/set-enrichment.json
          git diff --cached --quiet || git commit -m "Resolve requested catalog sets"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "Katalog-Synchronisierung fehlgeschlagen; nächster Lauf wiederholt den Abgleich."
          exit 1
