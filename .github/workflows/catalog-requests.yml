name: Catalog request lookup
on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
permissions:
  contents: write
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Resolve requested set numbers
        env:
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          REQUESTS_ONLY: "1"
        run: python scripts/enrich_catalog.py
      - name: Commit catalog updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/set-enrichment.json
          git diff --cached --quiet || git commit -m "Resolve requested catalog sets"
          git push
